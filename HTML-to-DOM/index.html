<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML to DOM Tree Generator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:#fff;
    min-height:100vh;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h2{
    font-size:34px;
    color:#38bdf8;
    margin-bottom:8px;
}

.header p{
    color:#cbd5e1;
    font-size:16px;
}

textarea{
    width:100%;
    height:240px;
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    resize:vertical;
    background:#1e293b;
    color:#fff;
    font-size:15px;
    box-shadow:0 0 10px rgba(0,0,0,.3);
}

.buttons{
    margin-top:20px;
    text-align:center;
}

button{
    background:#0ea5e9;
    color:white;
    border:none;
    padding:12px 28px;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#0284c7;
    transform:translateY(-2px);
}

#output{
    margin-top:30px;
    background:#ffffff;
    color:#111827;
    border-radius:12px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.tree ul{
    list-style:none;
    margin-left:20px;
    padding-left:18px;
    border-left:2px dashed #94a3b8;
}

.tree li{
    position:relative;
    margin:10px 0;
    padding-left:18px;
}

.tree li::before{
    content:"";
    position:absolute;
    left:-2px;
    top:13px;
    width:14px;
    border-top:2px dashed #94a3b8;
}

.tag{
    color:#2563eb;
    font-weight:bold;
    background:#dbeafe;
    padding:3px 8px;
    border-radius:6px;
}

.text{
    color:#16a34a;
    font-style:italic;
}

</style>

</head>
<body>

<div class="container">

    <div class="header">
        <h2>🌳 HTML Structure Visualizer</h2>
        <p>Paste your HTML code and generate its DOM Tree representation.</p>
    </div>

    <textarea id="htmlInput">
<div>
    <h1>Hello World</h1>
    <p>Welcome to DOM</p>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
    </ul>
</div>
    </textarea>

    <div class="buttons">
        <button onclick="generateTree()">Generate Tree</button>
    </div>

    <div id="output" class="tree"></div>

</div>
<script>

function generateTree(){

    let html=document.getElementById("htmlInput").value;

    let parser=new DOMParser();

    let doc=parser.parseFromString(html,"text/html");

    let output=document.getElementById("output");

    output.innerHTML="";

    let root=document.createElement("ul");

    function build(node){

        if(node.nodeType===Node.TEXT_NODE){

            let text=node.textContent.trim();

            if(text==="") return null;

            let li=document.createElement("li");

            li.innerHTML="<span class='text'>"+text+"</span>";

            return li;
        }

        if(node.nodeType!==Node.ELEMENT_NODE)
            return null;

        let li=document.createElement("li");

        li.innerHTML="<span class='tag'>&lt;"+node.tagName.toLowerCase()+"&gt;</span>";

        let children=document.createElement("ul");

        Array.from(node.childNodes).forEach(function(child){

            let childNode=build(child);

            if(childNode)
                children.appendChild(childNode);

        });

        if(children.childElementCount>0)
            li.appendChild(children);

        return li;

    }

    Array.from(doc.body.children).forEach(function(node){

        let treeNode=build(node);

        if(treeNode)
            root.appendChild(treeNode);

    });

    output.appendChild(root);

}

generateTree();


</script>

</body>
</html>
