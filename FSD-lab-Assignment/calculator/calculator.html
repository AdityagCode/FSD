<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JavaScript Calculator (Functions)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; }
    .calculator { max-width: 420px; margin: 0 auto; }
    label { display: block; margin-top: 0.75rem; }
    input, select, button { width: 100%; padding: 0.5rem; font-size: 1rem; margin-top: 0.25rem; }
    #result { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <div class="calculator">
    <h1>JavaScript Calculator (Functions)</h1>

    <label for="num1">First number</label>
    <input id="num1" type="number" step="any" placeholder="Enter first number" />

    <label for="num2">Second number</label>
    <input id="num2" type="number" step="any" placeholder="Enter second number" />

    <label for="operator">Operator</label>
    <select id="operator">
      <option value="+">Addition (+)</option>
      <option value="-">Subtraction (-)</option>
      <option value="*">Multiplication (*)</option>
      <option value="/">Division (/)</option>
    </select>

    <button id="calcBtn">Calculate</button>

    <div id="result" aria-live="polite"></div>

    <p style="margin-top:1rem; font-size:0.9rem; color:#555;">You can also open the browser console and call <code>calculateFromConsole(a, b, op)</code>.</p>
  </div>

  <script src="calculator.js"></script>
</body>
</html>
